<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson 2.1</title>

        <style>
            /* SOLUTION: learner-added type and id selector rules for the fruit sections */
            h1 {
                text-decoration: underline;
                font-family: 'Mononoki';
            }

            div {
                border: 1px solid black;
                margin: 20px;
                padding: 10px;
                width: 250px;
                height: 50px;
            }

            p {
                font-size: 20px;
            }

            #banana {
                background-color: yellow;
            }

            #strawberry {
                background-color: lightcoral;
            }

            #grape {
                background-color: lightgreen;
            }
        </style>
    </head>

    <body>
        <h1>Popular Fruits Within the US</h1>

        <div id="banana"><p>Bananas were the most sold fruit in 2024.</p></div>
        <div id="strawberry"><p>Strawberries were the second most sold fruit.</p></div>
        <div id="grape"><p>Grapes were the fourth highest-selling fruit in 2024.</p></div>
    </body>
</html>
