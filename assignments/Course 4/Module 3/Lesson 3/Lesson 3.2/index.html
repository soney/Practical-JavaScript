<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course 4 Lesson 3.2</title>
    <link rel="stylesheet" href="react/course4.css">
    <style>
      /* Color-code the effect-driven "Active level" line so the three settings
         (Info / Warning / Error) are easy to tell apart at a glance. Each level
         tints the box, its left accent bar, the status dot, and the level badge.
         This is presentational only -- the line's text content is unchanged. */
      .active-level {
        align-items: center;
        border-left-width: 6px;
        display: flex;
        font-weight: 600;
        gap: 0.55rem;
      }
      .active-level::before {
        background: currentColor;
        border-radius: 50%;
        content: "";
        flex: none;
        height: 0.85rem;
        width: 0.85rem;
      }
      .active-level .level-name {
        border-radius: 999px;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0.04em;
        padding: 0.1rem 0.6rem;
        text-transform: uppercase;
      }
      .active-level.level-info {
        background: #e8f1ff;
        border-color: #2457c5;
        color: #16419b;
      }
      .active-level.level-info .level-name {
        background: #2457c5;
      }
      .active-level.level-warning {
        background: #fff3d4;
        border-color: #c67c17;
        color: #8a5300;
      }
      .active-level.level-warning .level-name {
        background: #c67c17;
      }
      .active-level.level-error {
        background: #fdecec;
        border-color: #c53030;
        color: #9b2c2c;
      }
      .active-level.level-error .level-name {
        background: #c53030;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="react/react.development.js"></script>
    <script src="react/react-dom.development.js"></script>
    <script src="react/jsx.min.js"></script>
    <script type="text/babel" data-presets="react" src="main-2.jsx"></script>
  </body>
</html>
