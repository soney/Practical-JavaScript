    <style>
      /* The archive status starts as a neutral "pending" banner and turns into
         a green "done" banner once archiveItem() adds the is-archived class, so
         the effect of clicking Confirm Archive is obvious at a glance. */
      .archive-status {
        margin: 1rem 0 0;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 1px solid #d9dee8;
        background: #eef1f5;
        color: #5c6675;
        font-weight: 700;
      }
      .archive-status.is-archived {
        border-color: #9cccae;
        background: #e8f7ed;
        color: #206238;
      }
    </style>
  </head>
