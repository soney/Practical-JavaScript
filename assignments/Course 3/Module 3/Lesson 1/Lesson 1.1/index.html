<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-1.js INSTEAD. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Persistent Counter</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        #count { font-size: 72px; font-weight: bold; margin: 20px 0; }
        .buttons { display: flex; gap: 10px; justify-content: center; }
        button { font-size: 20px; padding: 10px 20px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #f4f4f4; }
        button:hover { background: #e8e8e8; }
        .hint { color: #666; font-size: 14px; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Persistent Counter</h1>
    <div id="count">0</div>
    <div class="buttons">
        <button id="decrement">-</button>
        <button id="reset">Reset</button>
        <button id="increment">+</button>
    </div>
    <p class="hint">Change the count, then reload the page. Your count should still be there.</p>

    <script src="main-1.js"></script>
</body>
</html>
