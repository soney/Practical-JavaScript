<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT server.js INSTEAD. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; width: 100%; max-width: 360px; margin-top: 60px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; font-size: 22px; margin-top: 0; }
        label { display: block; margin: 12px 0 4px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 16px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; min-height: 18px; }
        #status.ok { background: #e6f4e6; border: 1px solid #b8dcb8; color: #1e7d1e; }
        #status.error { background: #fbeaea; border: 1px solid #e5b8b8; color: #c0392b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Account Login</h1>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="off" placeholder="e.g. alice">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Your password">
        <button id="login-btn">Log In</button>
        <p id="status"></p>
    </div>

    <script src="main-3.js"></script>
</body>
</html>
