<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background-color: #ffffff;
            color: #1a1a1a;
        }
        body.dark {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }
        .card {
            border: 1px solid #cccccc;
            padding: 1rem;
            margin-top: 1rem;
            max-width: 24rem;
        }
        body.dark .card {
            border-color: #555555;
        }
        button {
            padding: 0.4rem 0.8rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <h1>Theme Switcher</h1>

    <div class="card">
        <p>This page remembers whether you prefer dark mode, even after you reload.</p>
        <button id="toggle-button">Toggle dark mode</button>
    </div>

    <script src="main-2.js"></script>
</body>
</html>
