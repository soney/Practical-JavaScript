<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-2.js INSTEAD. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera Check</title>
    <style>
        body { font-family: sans-serif; max-width: 540px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 24px; }
        video { width: 320px; height: 240px; background: #222; border-radius: 4px; display: block; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f4f4f4; margin-top: 12px; }
        button:hover { background: #e8e8e8; }
        #camera-status { margin: 12px 0; padding: 10px; background: #f0f4fa; border: 1px solid #c9d8ee; border-radius: 4px; }
        h2 { font-size: 16px; color: #333; margin-bottom: 4px; }
        #constraints-display { font-family: monospace; font-size: 13px; background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px; padding: 10px; min-height: 18px; }
        .hint { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Camera Check</h1>
    <video id="local-video" autoplay muted playsinline></video>
    <button id="start-camera-btn">Start camera</button>
    <p id="camera-status"></p>

    <h2>Constraints your code requested</h2>
    <div id="constraints-display"></div>
    <p class="hint">This page fakes navigator.mediaDevices.getUserMedia so it works in the grading environment, which has no camera. Your code calls it exactly like the real one.</p>

    <script src="main-2.js"></script>
</body>
</html>
