<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-1.js INSTEAD. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start a Call</title>
    <style>
        body { font-family: sans-serif; max-width: 540px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 24px; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f4f4f4; }
        button:hover { background: #e8e8e8; }
        #call-status { margin: 16px 0; padding: 10px; background: #f0f4fa; border: 1px solid #c9d8ee; border-radius: 4px; }
        h2 { font-size: 16px; color: #333; margin-bottom: 4px; }
        #local-desc { font-family: monospace; font-size: 13px; background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px; padding: 10px; min-height: 18px; word-break: break-all; }
        #signal-log { list-style: none; padding: 0; }
        #signal-log li { font-family: monospace; font-size: 13px; background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; margin: 6px 0; word-break: break-all; }
        .hint { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Start a Call</h1>
    <p class="hint">WebRTC calls start with an offer: create it, save it as the local description, then send it to the other person through the signaling server.</p>
    <button id="start-call-btn">Start call</button>
    <p id="call-status"></p>

    <h2>Local description</h2>
    <div id="local-desc"></div>

    <h2>Messages sent to the signaling server</h2>
    <ul id="signal-log"></ul>

    <script src="main-1.js"></script>
</body>
</html>
