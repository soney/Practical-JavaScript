<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>External Libraries - Lodash Utilities</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h1 { color: #222; }
        .row { margin: 6px 0; }
        .label { display: inline-block; width: 80px; color: #333; }
        .value { font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js" defer></script>
    <script src="main-2.js" defer></script>
</head>
<body>

    <h1>Price Summary</h1>

    <p class="row"><span class="label">Total:</span> <span id="total" class="value"></span></p>
    <p class="row"><span class="label">Average:</span> <span id="average" class="value"></span></p>
    <p class="row"><span class="label">Largest:</span> <span id="largest" class="value"></span></p>

</body>
</html>
