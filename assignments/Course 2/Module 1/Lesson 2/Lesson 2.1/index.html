<body>
  <div class="game-container">
    <h1>Word Guessing Game</h1>
    <p class="instructions">Try to guess the secret programming word!</p>
    
    <div class="input-group">
      <label for="guessInput">Enter your guess:</label>
      <input type="text" id="guessInput" placeholder="Type your guess here...">
    </div>
    
    <button id="guessButton">Guess</button>
    
    <p id="feedback"></p>
    
    <div class="hint">
      <strong>Hint:</strong> The secret word is a popular programming language that runs in the browser.
    </div>
  </div>
