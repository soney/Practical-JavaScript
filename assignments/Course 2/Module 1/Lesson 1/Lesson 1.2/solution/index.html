<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 1.2</title>
  </head>
  <body>
    <section id="content">
      <div class="card">
        <p class="text">Paragraph One</p>
        <p class="text">Paragraph Two</p>
      </div>
    </section>

    <script>
      // SOLUTION: learner writes the script below (starter had only a stub)
      const sectionEl = document.querySelector('#content');
      const cardDiv = sectionEl.querySelector('.card');
      const paragraphs = cardDiv.querySelectorAll('.text');
      for (const paragraph of paragraphs) {
        paragraph.textContent = paragraph.textContent.toUpperCase();
      }
    </script>
  </body>
</html>
