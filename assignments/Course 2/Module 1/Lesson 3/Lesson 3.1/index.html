<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Lesson 3.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Add tasks and mark them as done</p>

    <div class="input-section">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        autocomplete="off"
      >
      <button id="addButton">Add Task</button>
    </div>
    <ul id="todoList">
      <!-- Tasks will be added here dynamically -->
    </ul>
  </div>
  <script src="main-1.js"></script>
</body>
