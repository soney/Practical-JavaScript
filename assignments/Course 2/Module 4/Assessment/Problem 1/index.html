<!DOCTYPE html>
<!-- Edit the CSS in the <style> block below. The JavaScript is in main-1.js and is already written for you. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 1: Progress Bar Transition</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    #progress-container {
      width: 100%;
      height: 40px;
      background-color: #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      margin: 30px 0;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background-color: #4CAF50;
      /* TODO: add a CSS transition here so that a change to the width
         animates smoothly over 2 seconds using the built-in ease-in-out
         timing function. */
    }
    #percent-label {
      text-align: center;
      font-size: 24px;
      color: #333;
      margin: 0;
    }
    .controls {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>Loading Progress Animation</h1>
  <div id="progress-container">
    <div id="progress-fill"></div>
  </div>
  <p id="percent-label">0%</p>
  <div class="controls">
    <button onclick="setProgress(50)">50%</button>
    <button onclick="setProgress(75)">75%</button>
    <button onclick="setProgress(100)">100%</button>
  </div>
  <script src="main-1.js"></script>
</body>
</html>
