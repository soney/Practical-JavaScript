<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-1.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 1.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timer-container">
    <h1>Countdown Timer</h1>
    <p class="subtitle">Click the button to start a 5-second countdown</p>
    
    <button id="startButton">Start 5-Second Timer</button>
    
    <p id="timerDisplay"></p>
    <p id="timerFeedback"></p>

    <div class="instructions">
      <h3>How it works:</h3>
      <p>
        1. Click the "Start 5-Second Timer" button<br>
        2. The timer will start and the button will be disabled<br>
        3. Wait for 5 seconds<br>
        4. See the completion message<br>
        5. The button will be re-enabled for another countdown
      </p>
    </div>
  </div>

  <script src="main-1.js"></script>
</body>
</html>
