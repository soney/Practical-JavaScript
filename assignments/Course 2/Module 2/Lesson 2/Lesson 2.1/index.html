<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-1.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 2.1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
    }

    .header {
      background: #667eea;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      margin-bottom: 8px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 30px;
    }

    .products-section {
      border-right: 1px solid #e0e0e0;
      padding-right: 20px;
    }

    .products-section h2 {
      margin-bottom: 20px;
    }

    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .product-button {
      background: white;
      border: 2px solid #667eea;
      color: #667eea;
      padding: 15px 20px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .product-button:hover {
      background: #667eea;
      color: white;
    }

    .cart-section h2 {
      margin-bottom: 20px;
    }

    .cart-total {
      background: #667eea;
      color: white;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }

      .products-section {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding-right: 0;
        padding-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Tech Store</h1>
      <p>Click a product to add its price to your total</p>
    </div>

    <div class="content">
      <div class="products-section">
        <h2>Available Products</h2>
        <div class="product-grid" id="productList"></div>
      </div>

      <div class="cart-section">
        <h2>Your Cart</h2>
        <div class="cart-total">
          <p id="cartTotal">Total: $0</p>
        </div>
      </div>
    </div>
  </div>

  <script src="main-1.js"></script>
</body>
</html>
