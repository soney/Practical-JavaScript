<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-3.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 2.3 - Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .header {
      background: #4f63b6;
      color: white;
      padding: 40px;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }

    .header h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 40px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input[type="text"] {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #764ba2;
    }

    button:active {
      transform: scale(0.98);
    }

    #formMessage {
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      min-height: 20px;
      text-align: center;
    }

    #formMessage.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
    }

    #formMessage.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #81c784;
    }

    #formMessage.empty {
      background: transparent;
      border: none;
      color: transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Sign Up Form</h1>
      <p>Create your account by entering a username</p>
    </div>

    <div class="content">
      <form id="signupForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            placeholder="Enter your username" 
            required
          />
        </div>
        <button type="submit">Sign Up</button>
      </form>
      <p id="formMessage" class="empty"></p>
    </div>
  </div>

  <script src="main-3.js"></script>
</body>
</html>
