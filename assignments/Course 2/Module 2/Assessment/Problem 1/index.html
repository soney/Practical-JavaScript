<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    #counter-button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;

      border-radius: 5px;
      cursor: pointer;
    }
    #counter-button:hover {
      background-color: #45a049;
    }
    .display {
      margin-top: 20px;
      font-size: 24px;
      color: #333;
    }
    #click-display {
      font-weight: bold;
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <h1>Click Counter</h1>
  <button id="counter-button">Click Me!</button>
  <div class="display">
    Clicks: <span id="click-display">0</span>
  </div>
  <script src="main-1.js"></script>
</body>
