<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-2.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .form-group {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    #email-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #email-input:focus {
      outline: none;
      border-color: #4CAF50;
    }
    #feedback-message {
      margin-top: 10px;
      font-size: 14px;
      min-height: 20px;
    }
    .valid {
      color: green;
    }
    .invalid {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Email Validator</h1>
  <div class="form-group">
    <label for="email-input">Enter your email:</label>
    <input type="text" id="email-input" placeholder="example@email.com">
    <div id="feedback-message"></div>
  </div>
  <script src="main-2.js"></script>
</body>
</html>
