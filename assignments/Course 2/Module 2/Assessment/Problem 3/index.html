<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-3.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 3: Mouse Hover Effect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    #hover-card {
      padding: 40px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      background-color: white;
      transition: background-color 0.3s ease;
    }
    #hover-card.hovered {
      background-color: lightblue;
    }
    #hover-card h2 {
      margin: 0 0 10px 0;
      color: #333;
    }
    #hover-card p {
      margin: 0;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Hover Card Demo</h1>
  <div id="hover-card">
    <h2>Interactive Card</h2>
    <p>Hover over this card to see the effect!</p>
  </div>
  <script src="main-3.js"></script>
</body>
</html>
