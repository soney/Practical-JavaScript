<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-1.js INSTEAD. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 3.1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .screen {
            background-color: #ddd;
            height: 50px;
            margin: 20px 0;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
        }
        .seating {
            margin: 20px 0;
        }
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }
        .seat {
            width: 50px;
            height: 50px;
            background-color: #4CAF50;
            border: 2px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .seat.selected {
            background-color: #2196F3;
        }
        .seat.unavailable {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .info {
            margin: 20px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
        }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <h1>Concert Seat Selection</h1>
    
    <div class="screen">STAGE</div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-box" style="background-color: #4CAF50;"></div>
            <span>Available</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background-color: #2196F3;"></div>
            <span>Selected</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background-color: #ccc;"></div>
            <span>Unavailable</span>
        </div>
    </div>
    
    <div class="seating">
        <div class="row">
            <div class="seat" id="seat-a1">A1</div>
            <div class="seat unavailable" id="seat-a2">A2</div>
            <div class="seat" id="seat-a3">A3</div>
        </div>
        <div class="row">
            <div class="seat" id="seat-b1">B1</div>
            <div class="seat" id="seat-b2">B2</div>
            <div class="seat" id="seat-b3">B3</div>
        </div>
    </div>
    
    <div class="info">
        <p>Selected Seats: <span id="selectedCount">0</span></p>
        <p>Total Price: <span id="totalPrice">$0</span></p>
    </div>
    
    <script src="main-1.js"></script>
</body>
</html>
