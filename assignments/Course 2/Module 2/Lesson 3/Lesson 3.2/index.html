<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 3 - Multi-Currency Cart</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
    .cart-box { background: white; padding: 2rem; border-radius: 8px; width: 300px; }
    input, select { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    .result { font-weight: bold; color: #2c3e50; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="cart-box">
    <label>Amount in USD:</label>
    <input type="number" id="usd-input" placeholder="0.00">
    
    <label>Convert to:</label>
    <select id="currency-selector">
      <option value="EUR">EUR (€)</option>
      <option value="GBP">GBP (£)</option>
    </select>

    <div class="result">
      Converted: <span id="converted-amount">0.00</span>
    </div>
  </div>

  <script src="main-2.js"></script>
</body>
</html>
