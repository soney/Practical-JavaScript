<!DOCTYPE html>
<!-- DO NOT MODIFY THIS FILE. EDIT main-2.js INSTEAD. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #e8f5e9;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    #search-container {
      text-align: center;
      margin: 20px 0;
    }
    select {
      padding: 10px;
      font-size: 16px;
      width: 220px;
      border: 2px solid #4CAF50;
      border-radius: 4px;
      background-color: white;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #weather-card {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .info-row {
      margin: 20px 0;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 4px;
    }
    .info-label {
      font-weight: bold;
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }
    #weather-temperature {
      font-size: 24px;
      color: #2196F3;
      font-weight: bold;
    }
    #weather-windspeed {
      font-size: 24px;
      color: #FF9800;
      font-weight: bold;
    }
  </style>
  <script src="cached-fetch.js"></script>
</head>
<body>
  <h1>Weather Explorer</h1>
  <div id="search-container">
    <select id="city-select">
      <option value="Ann Arbor">Ann Arbor</option>
      <option value="New York">New York</option>
      <option value="London">London</option>
      <option value="Tokyo">Tokyo</option>
      <option value="Sydney">Sydney</option>
    </select>
    <button onclick="handleLookup()">Get Weather</button>
  </div>
  <div id="weather-card">
    <div class="info-row">
      <div class="info-label">Temperature (C):</div>
      <div id="weather-temperature">--</div>
    </div>
    <div class="info-row">
      <div class="info-label">Wind speed (km/h):</div>
      <div id="weather-windspeed">--</div>
    </div>
  </div>
  <script src="main-2.js"></script>
  <script>
    function handleLookup() {
      const city = document.querySelector('#city-select').value;
      if (window.lookupWeather) { window.lookupWeather(city); }
    }
    window.handleLookup = handleLookup;
  </script>
</body>
</html>
