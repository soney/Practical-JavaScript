<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 1.4 - Promise.race</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 6px;
      width: 400px;
      text-align: center;
    }
    h2 { color: #2c3e50; margin-bottom: 1rem; }
    p { color: #555; }
    .status-box {
      background: #282c34;
      color: #61dafb;
      padding: 15px;
      border-radius: 6px;
      text-align: left;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      margin: 1.5rem 0;
      min-height: 60px;
      white-space: pre-wrap;
    }
    button {
      background-color: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }
    button:hover { background-color: #a29bfe; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Promise.race Demo</h2>
    <p>Three servers respond at different speeds. Which one wins?</p>
    <div id="console" class="status-box">Waiting to start...</div>
    <button id="runBtn">Race the servers</button>
  </div>

  <script src="main-4.js"></script>
