<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Join Our Platform</h1>
            <p>Please fill out all fields carefully.</p>
        </header>

        <main>
            <div id="error-message" class="error-banner hidden">
                <p><strong>Error:</strong> The passcode you entered is invalid.</p>
            </div>

            <form id="registrationForm" class="registration-form" novalidate>
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="address">Street Address</label>
                    <textarea id="address" name="address" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group highlight">
                    <label for="passcode">Secret Passcode (Must be exactly 6 digits)</label>
                    <input type="text" id="passcode" name="passcode" required>
                </div>

                <button type="submit" class="submit-btn">Register Account</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
