<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Live: Shopping Cart Demo</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --success-bg: #D1FAE5;
            --success-text: #065F46;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .product-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .product-price {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .cart-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            bottom: 2rem;
            z-index: 10;
        }

        .cart-info h2 {
            margin: 0 0 0.25rem 0;
            font-size: 1.5rem;
        }

        .cart-stats {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* The live region styling */
        .live-region-container {
            margin-top: 1rem;
            min-height: 60px;
            /* Pre-allocate space */
        }

        .announcement {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .announcement.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Utility for screen reader only text (optional, but good for context) */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Shopping Cart</h1>
            <p>A demonstration of <code>aria-live</code> regions</p>
        </header>

        <main>
            <div class="products-grid">
                <article class="product-card">
                    <div class="product-icon" aria-hidden="true">🎧</div>
                    <h2 class="product-title">Headphones</h2>
                    <div class="product-price" aria-label="Price: $99.00">$99.00</div>
                    <button onclick="addToCart('Headphones', 99.00)">Add to Cart<span class="sr-only">,
                            Headphones</span></button>
                </article>
                <article class="product-card">
                    <div class="product-icon" aria-hidden="true">⌨️</div>
                    <h2 class="product-title">Mechanical Keyboard</h2>
                    <div class="product-price" aria-label="Price: $120.00">$120.00</div>
                    <button onclick="addToCart('Mechanical Keyboard', 120.00)">Add to Cart<span class="sr-only">,
                            Mechanical Keyboard</span></button>
                </article>
                <article class="product-card">
                    <div class="product-icon" aria-hidden="true">🖱️</div>
                    <h2 class="product-title">Wireless Mouse</h2>
                    <div class="product-price" aria-label="Price: $45.00">$45.00</div>
                    <button onclick="addToCart('Wireless Mouse', 45.00)">Add to Cart<span class="sr-only">, Wireless
                            Mouse</span></button>
                </article>
            </div>

            <section class="cart-panel" aria-label="Shopping Cart Summary">
                <div class="cart-info">
                    <h2>Your Cart</h2>
                    <p class="cart-stats">
                        <span id="cart-count">0</span> items &bull;
                        Total: $<span id="cart-total">0.00</span>
                    </p>
                </div>
            </section>

            <div class="live-region-container">
                <div id="cart-announcement" class="announcement" aria-live="polite" aria-atomic="true"></div>
            </div>
        </main>
    </div>

    <script>
        let cartCount = 0;
        let cartTotal = 0.0;
        let announcementTimeout;

        function addToCart(itemName, price) {
            // Update cart state
            cartCount++;
            cartTotal += price;

            // Update DOM visual numbers
            document.getElementById('cart-count').textContent = cartCount;
            document.getElementById('cart-total').textContent = cartTotal.toFixed(2);

            // Update ARIA Live Region
            const announcementEl = document.getElementById('cart-announcement');

            // Set the new message
            const message = `Added ${itemName} to cart. Your cart now has ${cartCount} item${cartCount > 1 ? 's' : ''}, totaling $${cartTotal.toFixed(2)}.`;
            announcementEl.textContent = message;

            // Handle visual toast notification
            announcementEl.classList.remove('show');
            // Small delay to trigger CSS transition restart
            setTimeout(() => {
                announcementEl.classList.add('show');
            }, 10);

            // Clear the message visually after 5 seconds
            clearTimeout(announcementTimeout);
            announcementTimeout = setTimeout(() => {
                announcementEl.classList.remove('show');
            }, 9000);
        }
    </script>
</body>

</html>
