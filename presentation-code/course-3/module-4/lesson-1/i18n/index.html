<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i18next Web Application</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app" class="container">
      <header>
        <h1 data-i18n="header.title">Welcome</h1>
        <div class="language-switcher">
          <button onclick="changeLanguage('en')">English</button>
          <button onclick="changeLanguage('es')">Español</button>
          <button onclick="changeLanguage('fr')">Français</button>
        </div>
      </header>
      <main>
        <p data-i18n="main.description">This is a demonstration of how to use i18next in a web application.</p>
        <div class="card">
          <h2 data-i18n="card.title">Dynamic Content</h2>
          <p id="dynamic-content"></p>
        </div>
      </main>
      <footer>
        <p data-i18n="footer.text">© 2026 i18next Demo</p>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
