<!DOCTYPE html>
<html>
    <body>
        <h1>Log In to your account</h1>

        <!-- No form: clicking this link hands the whole login over to Google.
             The server route (/auth/google) redirects the browser to Google,
             and Google redirects back once the user has logged in. -->
        <a href="/auth/google">
            <button type="button">Log In with Google</button>
        </a>
    </body>
</html>
