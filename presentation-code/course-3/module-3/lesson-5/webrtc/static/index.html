<!DOCTYPE html>
<html>
    <head>
        <script src="main.js" defer></script>
        <style>
            .video-container {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 20px;
            }

            video {
                background-color: black;
                width: 400px;
                height: 300px;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <button id="connectBtn" disabled>Start Call</button>
        <div class="video-container">
            <div>
                <h3>Local Video</h3>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div>
                <h3>Remote Video</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </body>
</html>
