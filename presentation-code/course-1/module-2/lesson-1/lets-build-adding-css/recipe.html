<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banana Bread</title>

    <!-- 3) External stylesheet: styles live in their own .css file. -->
    <link rel="stylesheet" href="recipe.css" />

    <!-- 2) The style element: rules that apply to this whole page. -->
    <style>
      h1 {
        color: darkgreen;
      }
    </style>
  </head>
  <body>
    <!-- 1) Inline CSS: a style attribute on a single element. -->
    <h1 style="text-align: center;">Banana Bread</h1>

    <h2>Ingredients</h2>
    <ul class="ingredients">
      <li>3 ripe bananas</li>
      <li>1/3 cup melted butter</li>
      <li>1 cup sugar</li>
      <li>1 1/2 cups flour</li>
    </ul>

    <h2>Steps</h2>
    <p class="step">Mash the bananas, then stir in the butter and sugar.</p>
    <p class="step">Add the flour, pour into a pan, and bake at 350F.</p>
  </body>
</html>
