<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Your First Script</title>
  </head>
  <body>
    <h1>Your First Script</h1>
    <p>Open the browser console (Developer Tools) to see the output.</p>

    <script>
      // A script runs from top to bottom when the page loads.

      // Every expression produces a value. console.log() prints it.
      console.log("Hello, world!"); // a string
      console.log(7 + 5); // a number expression -> 12
      console.log(3 > 2); // a boolean expression -> true

      // Some values have no value yet:
      let mystery;
      console.log(mystery); // undefined

      /*
        This is a multi-line comment.
        Comments explain the code without changing what it does.
      */
      console.log("This is the last line to run.");
    </script>
  </body>
</html>
