<!DOCTYPE html>
<html>
    <head>
        <style>
            #block {
                position: absolute;
                width: 200px;
                height: 200px;
                left: 0px;
                background-color: red;
                transition: background-color 1s,
                            left 3s ease-in-out;
            }
            #block:hover {
                left: 30px;
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div id="block"></div>
    </body>
</html>
