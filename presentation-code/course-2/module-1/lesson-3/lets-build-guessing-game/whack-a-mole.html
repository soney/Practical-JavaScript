<html>
  <body>
    <input id="guess" type="text" />
    <button id="guess-btn">Guess</button>
    <p id="past-guesses"></p>
    <p id="result"></p>

    <script>
      const pastGuesses = [];
      const secretWord = "javascript";
      const guessButton = document.querySelector("#guess-btn");
      const guessInput = document.querySelector("#guess");
      const pastGuessesDisplay = document.querySelector("#past-guesses");
      const resultDisplay = document.querySelector("#result");

      guessButton.addEventListener("click", function () {
        const guess = guessInput.value.trim().toLowerCase();

        if (guess === "") {
          resultDisplay.textContent = "Please enter a guess.";
          return;
        }

        pastGuesses.push(guess);
        pastGuessesDisplay.textContent = "Past guesses: " + pastGuesses.join(", ");

        if (guess === secretWord) {
          resultDisplay.textContent = "🎉 Correct! You guessed the secret word!";
          guessButton.disabled = true;
          guessInput.disabled = true;
        } else {
          resultDisplay.textContent = "❌ Try again!";
        }

        guessInput.value = "";
        guessInput.focus();
      });
    </script>
  </body>
</html>
