<html>
    <body>
        <button id="btn">Click me!</button>
    </body>
    <script>
        const btn = document.querySelector("#btn");
        function callback() {
            console.log("Clicked on the button!");
            console.log("------");
        }

        // btn.addEventListener("click", callback);
        btn.addEventListener("click", callback);


    </script>
</html>
