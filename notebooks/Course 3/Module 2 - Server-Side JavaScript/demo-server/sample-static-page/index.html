<!DOCTYPE html>
<html>
  <head>
    <title>A static page</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Served from a file</h1>

    <p>
      This page was read off the disk by a Node server and sent to your
      browser. Nothing about it was generated per request, which is what
      makes it a <strong>static</strong> file.
    </p>

    <p>Open the Network tab and reload to see every file this one page asks for.</p>

    <button id="greet">Say hello</button>
    <p id="output"></p>

    <script src="script.js"></script>
  </body>
</html>
