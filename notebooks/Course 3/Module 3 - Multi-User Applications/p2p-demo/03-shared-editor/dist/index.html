<!DOCTYPE html>
<html>
    <head>
        <title>Shared Editor</title>
        <!-- #region stylesheet -->
        <!-- Quill's stylesheet comes from a CDN, so this page needs a
             network connection. -->
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
        <!-- #endregion -->
    <script defer src="main.js"></script></head>
    <body>
        <!-- #region editor -->
        <!-- The container the editor is created in. webpack adds the
             script tag for the bundled editor.js when it builds dist/. -->
        <div id="editor"></div>
        <!-- #endregion -->
    </body>
</html>
