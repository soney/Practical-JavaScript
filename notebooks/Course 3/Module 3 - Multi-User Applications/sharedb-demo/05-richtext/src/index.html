<!DOCTYPE html>
<html>
    <head>
        <!-- #region stylesheet -->
        <!-- Include stylesheet -->
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
        <!-- #endregion -->
    </head>
    <body>
        <!-- #region editor -->
        <!-- Create the editor container -->
        <div id="editor"></div>

        <!-- Include the Quill library -->
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

        <!-- Initialize Quill editor -->
        <script>
        const quill = new Quill('#editor', {
            theme: 'snow'
        });

        // Start read-only; client.js enables the editor once the shared
        // document has arrived, so no keystrokes land before then.
        quill.disable();
        </script>
        <!-- #endregion -->
    </body>
</html>
