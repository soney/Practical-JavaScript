<!DOCTYPE html>
<!-- auth-demo: the home page. Both navigations start hidden; checkSession
     reveals the right one, and the Log out button ends the session. -->
<html>
    <body>
        <!-- #region guest-nav -->
        <div id="guest-nav" style="display:none">
            <ul>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Log In</a></li>
            </ul>
        </div>
        <!-- #endregion -->
        <!-- #region user-info -->
        <div id="user-info" style="display:none">
            <p>Welcome, <span id="user-email"></span>!</p>
            <button id="logout">Log out</button>
        </div>
        <!-- #endregion -->
        <!-- #region script -->
        <script>
            async function checkSession() {
                const response = await fetch("/me");
                if (response.ok) {
                    const user = await response.json();
                    document.querySelector("#user-email").textContent = user.email;
                    document.querySelector("#user-info").style.display = 'block';
                } else {
                    document.querySelector("#guest-nav").style.display = 'block';
                }
            }
            checkSession();

            const logoutButton = document.querySelector("button#logout");
            logoutButton.addEventListener('click', async () => {
                await fetch('/logout', { method: 'POST' });
                window.location.reload();
            });
        </script>
        <!-- #endregion -->
    </body>
</html>
